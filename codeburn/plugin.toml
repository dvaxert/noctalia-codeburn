# CodeBurn: today's AI coding spend in the Noctalia panel.
#
# service -> runs `codeburn-rs status --format menubar-json`
# bar     -> flame glyph and a cost, click opens the panel
# panel   -> period, cost, token chart, models, projects, and tools

id = "dvaxert/codeburn"
name = "CodeBurn"
version = "0.2.0"
plugin_api = 29
author = "dvaxert"
license = "MIT"
dependencies = ["codeburn-rs"]
tags = ["ai", "spend"]
icon = "flame"
description = "Claude, Codex, and Cursor spend from codeburn-rs."

[[setting]]
key = "binary"
type = "string"
label_key = "settings.binary.label"
description_key = "settings.binary.description"
default = ""

[[setting]]
key = "period"
type = "select"
label_key = "settings.period.label"
description_key = "settings.period.description"
default = "today"
options = [
  { value = "today", label_key = "period.today" },
  { value = "week", label_key = "period.week" },
  { value = "30days", label_key = "period.30days" },
  { value = "month", label_key = "period.month" },
  { value = "all", label_key = "period.all" },
]

[[setting]]
key = "refresh_sec"
type = "int"
label_key = "settings.refresh_sec.label"
description_key = "settings.refresh_sec.description"
default = 60
min = 15
max = 3600

[[service]]
id = "service"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

  [widget.actions]
  middle = "none"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 543
height = 1200
placement = "floating"
position = "top_right"
open_near_click = true
